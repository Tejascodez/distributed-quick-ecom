server:
  port: 8103

spring:
  config:
    # Secrets come from .env (repo root, or one level up when started from a module dir) or real env vars.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/order_db?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

ims:
  catalog-url: http://localhost:8102
  auth-url: http://localhost:8101
  checkout-timeout: 10m
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}   # shared secret from the payment gateway dashboard
    webhook-tolerance: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info
