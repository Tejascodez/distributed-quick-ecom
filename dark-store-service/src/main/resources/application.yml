server:
  port: 8102

spring:
  config:
    # Secrets come from .env (repo root, or one level up when started from a module dir) or real env vars.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: dark-store-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/store_db?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

ims:
  h3-resolution: 8   # ~0.7 km² hexagons; a 3-5 km delivery radius covers a few dozen cells

management:
  endpoints:
    web:
      exposure:
        include: health,info
