server:
  port: 8104

spring:
  config:
    # Secrets come from .env (repo root, or one level up when started from a module dir) or real env vars.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/inventory_db?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest

ims:
  # Longer than order-service's checkout-timeout (10m): the order side decides cancellations, and this sweeper
  # is only a backstop. Equal values let a 9:59 payment lose its hold before order-paid arrives.
  reservation-ttl: 15m
  reconcile:
    interval: 5m
    # Report-only by default: turn on once the drift logs have been checked against real traffic.
    repair: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
